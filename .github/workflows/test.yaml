name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  pull-requests: write
  contents: write

jobs:
  build:
    name: Test on ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, windows-11-arm, macos-14, macos-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.14t', '3.15', '3.15t']
        exclude:
          - os: windows-11-arm  # setup-python action only supports 3.11+
            python-version: '3.10'
    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        check-latest: true
        python-version: ${{ matrix.python-version }}
    
    - name: Build package
      run: python -m pip install .[test-advanced]
    
    - name: Run PyTests
      env:
        COLOR: yes
        PIP_USER: 1
      run: pytest tests -vv
      shell: bash
  
  # automerge if test suceeds and we are dependabot
  dependabot:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Enable auto-merge for Dependabot PRs
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
